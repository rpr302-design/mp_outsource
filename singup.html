    <title>Registration | YASK Samiti MP</title>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --bg-navy: #0f172a; --card-slate: #1e293b; --gold: #fbbf24; --link-blue: #3b82f6; --text-light: #f8fafc;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 10px; background-color: var(--bg-navy);
            background-image: radial-gradient(circle at top right, #1e3a8a, transparent), radial-gradient(circle at bottom left, #312e81, transparent);
            background-attachment: fixed; color: var(--text-light); font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
        }

        .registration-box, .receipt-card {
            width: 100%; max-width: 500px; background: var(--card-slate);
            border-radius: 25px; padding: 25px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); margin-top: 60px; position: relative;
        }

        /* लोगो फिक्स - बिल्कुल गोल */
        .logo-container {
            position: absolute; top: -50px; left: 50%; transform: translateX(-50%);
            width: 90px; height: 90px; background: #fff; border-radius: 50%;
            padding: 2px; border: 3px solid var(--gold); overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

        .form-header h1 { color: var(--gold); text-align: center; margin: 40px 0 5px; font-size: 19px; text-transform: uppercase; }
        .form-header p { text-align: center; margin-bottom: 20px; opacity: 0.8; font-size: 12px; }

        .section-tag { color: var(--gold); font-size: 11px; font-weight: bold; margin: 20px 0 10px; text-transform: uppercase; border-bottom: 1px solid rgba(251, 191, 36, 0.2); padding-bottom: 5px; }

        input, select {
            width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            color: #fff; font-size: 14px; outline: none; margin-bottom: 15px;
        }
        label { display: block; font-size: 11px; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
        select option { background: #1e293b; color: #fff; }

        #submitBtn {
            width: 100%; padding: 16px; background: var(--gold); color: #000;
            border: none; border-radius: 15px; font-size: 17px; font-weight: 800; cursor: pointer;
        }

        .signin-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .signin-link a { color: var(--link-blue); text-decoration: none; font-weight: bold; }

        /* Receipt UI */
        #receiptWrapper { display: none; margin-top: 20px; width: 100%; max-width: 480px; padding-bottom: 50px; }
        .receipt-card { background: #ffffff; color: #1a1a1a; border-top: 8px solid var(--gold); }
        .receipt-card h2 { text-align: center; color: #1e3a8a; border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 18px; }
        .data-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
        
        .receipt-btns { display: flex; gap: 10px; margin-top: 20px; width: 100%; }
        .btn-receipt { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 700; color: #fff; cursor: pointer; }
    </style>
</head>
<body>

<div class="registration-box" id="registrationForm">
    <div class="logo-container">
        <img src="https://lh3.googleusercontent.com/d/1_3vjppXdkVUv0voXV0eoKOiiz3iYQA9C" alt="Samiti Logo">
    </div>
    <div class="form-header">
        <h1>मध्य प्रदेश राज्य आउटसोर्स कर्मचारी संघ</h1>
    </div>

    <div class="section-tag">Personal Details</div>
    <label>Full Name *</label>
    <input type="text" id="name" placeholder="FULL NAME" oninput="this.value = this.value.toUpperCase()">
    
    <div style="display:flex; gap:10px;">
        <div style="flex:1;"><label>Mobile *</label><input type="tel" id="mobile" maxlength="10"></div>
        <div style="flex:1;"><label>WhatsApp *</label><input type="tel" id="whatsapp" maxlength="10"></div>
    </div>

    <label>Email ID *</label>
    <input type="email" id="email" placeholder="example@mail.com">
    <label>Password *</label>
    <input type="password" id="password" placeholder="Min 6 Characters">

    <div class="section-tag">Location & Job Info</div>
    <div style="display:flex; gap:10px;">
        <div style="flex:1;"><label>Division *</label><select id="division" onchange="updateDistricts()"></select></div>
        <div style="flex:1;"><label>District *</label><select id="district" onchange="updateTehsils()"><option value="">चुनें</option></select></div>
    </div>

    <div style="display:flex; gap:10px;">
        <div style="flex:1;"><label>Tehsil *</label><select id="tehsil"><option value="">चुनें</option></select></div>
        <div style="flex:1;"><label>Join Date *</label><input type="date" id="joinDate"></div>
    </div>

    <label>Department *</label>
    <select id="workDept" onchange="updatePosts()"></select>
    <label>Designation *</label>
    <select id="post"><option value="">चुनें</option></select>

    <div style="display:flex; gap:10px;">
        <div style="flex:1;"><label>Pincode *</label><input type="text" id="pincode" maxlength="6"></div>
        <div style="flex:1;"><label>Faimly Voters *</label><input type="number" id="voters"></div>
    </div>
    <label>Monthly Salary *</label>
    <input type="number" id="salary" placeholder="Max 30000">

    <button id="submitBtn" onclick="handleRegistration()">CREATE ACCOUNT</button>
    <div class="signin-link">
        Already have an account? <a href="https://uvaaoutsource.blogspot.com/p/singin.html">Sign In Here</a>
    </div>
</div>

<div id="receiptWrapper">
    <div class="receipt-card" id="receiptFinal">
        <div style="text-align:center;">
            <img src="https://lh3.googleusercontent.com/d/1hFpLHkijVKMubzPpdyAB-BNirAIZJ9zI" alt="Samiti Logo" width="60" height="60" style="border-radius:50%; object-fit:cover;">
            <h3 style="margin:5px 0; font-size:14px; color:#1e3a8a;">मध्य प्रदेश राज्य आउटसोर्स कर्मचारी संघ</h3>
        </div>
        <h2>MEMBERSHIP RECEIPT</h2>
        <div class="data-row"><b>Unique ID:</b> <span id="res_id" style="color:red; font-weight:800;"></span></div>
        <div class="data-row"><b>Name:</b> <span id="res_name"></span></div>
        <div class="data-row"><b>Mobile:</b> <span id="res_mob"></span></div>
        <div class="data-row"><b>Location:</b> <span id="res_loc"></span></div>
        <div class="data-row"><b>Join Date:</b> <span id="res_join"></span></div>
        <div class="data-row"><b>Reg. Date:</b> <span id="res_time"></span></div>
        <div id="qrOutput" style="display:flex; justify-content:center; margin-top:15px;"></div>
    </div>
    <div class="receipt-btns">
        <button class="btn-receipt" style="background:#059669;" onclick="window.print()">PRINT</button>
        <button class="btn-receipt" style="background:#2563eb;" onclick="downloadJPG()">DOWNLOAD JPG</button>
    </div>
</div>

    Object.keys(mpData).forEach(d => div.options.add(new Option(d, d)));
    const wd = document.getElementById("workDept");
    wd.innerHTML = '<option value="">-- विभाग चुनें --</option>';
    Object.keys(deptPosts).forEach(d => wd.options.add(new Option(d, d)));
};

function updateDistricts() {
    const div = document.getElementById("division").value;
    const dist = document.getElementById("district");
    dist.innerHTML = '<option value="">-- जिला चुनें --</option>';
    if(div) Object.keys(mpData[div]).forEach(d => dist.options.add(new Option(d, d)));
}
function updateTehsils() {
    const div = document.getElementById("division").value;
    const dist = document.getElementById("district").value;
    const teh = document.getElementById("tehsil");
    teh.innerHTML = '<option value="">-- तहसील चुनें --</option>';
    if(div && dist) mpData[div][dist].forEach(t => teh.options.add(new Option(t, t)));
}
function updatePosts() {
    const dept = document.getElementById("workDept").value;
    const p = document.getElementById("post");
    p.innerHTML = '<option value="">-- पद चुनें --</option>';
    if(deptPosts[dept]) deptPosts[dept].forEach(post => p.options.add(new Option(post, post)));
}

async function handleRegistration() {
    const btn = document.getElementById("submitBtn");
    const fields = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        mob: document.getElementById("mobile").value.trim(),
        wa: document.getElementById("whatsapp").value.trim(),
        div: document.getElementById("division").value,
        dist: document.getElementById("district").value,
        teh: document.getElementById("tehsil").value,
        join: document.getElementById("joinDate").value,
        dept: document.getElementById("workDept").value,
        post: document.getElementById("post").value,
        pin: document.getElementById("pincode").value.trim(),
        voters: document.getElementById("voters").value,
        salary: document.getElementById("salary").value
    };

 // Strict Mandatory Check
    for (let key in fields) {
        if (!fields[key]) {
            Swal.fire({ 
                icon: 'error', 
                title: 'Incomplete Form', 
                text: 'Please fill all the required columns to proceed.' 
            });
            return;
        }
    }

    if (fields.mob.length !== 10 || fields.wa.length !== 10) {
        Swal.fire({ 
            icon: 'error', 
            title: 'Invalid Number', 
            text: 'Mobile and WhatsApp numbers must be exactly 10 digits.' 
        });
        return;
    }

    if (!['45','46','47','48'].includes(fields.pin.substring(0,2))) {
        Swal.fire({ 
            icon: 'error', 
            title: 'Location Restriction', 
            text: 'Registration is only allowed for Madhya Pradesh residents.' 
        });
        return;
    }

    if (parseInt(fields.salary) > 30000 || parseInt(fields.voters) > 20) {
        Swal.fire({ 
            icon: 'warning', 
            title: 'Limit Exceeded', 
            text: 'Monthly salary must be under 30,000 and family voters under 20.' 
        });
        return;
    }

    btn.disabled = true; btn.innerText = "Processing...";

    try {
        const mobCheck = await db.collection("users").where("mob", "==", fields.mob).get();
        if (!mobCheck.empty) {
            Swal.fire({ icon: 'error', title: 'Error', text: 'Mobile Number already exists!' });
            btn.disabled = false; return;
        }

        const alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const uId = alpha.charAt(Math.floor(Math.random()*26)) + alpha.charAt(Math.floor(Math.random()*26)) + alpha.charAt(Math.floor(Math.random()*26)) + Math.floor(100 + Math.random()*899);

        const userCred = await auth.createUserWithEmailAndPassword(fields.email, document.getElementById("password").value);
        const timestamp = new Date().toLocaleString('en-IN');

        await db.collection("users").doc(userCred.user.uid).set({ ...fields, userId: uId, createdAt: timestamp });

        document.getElementById("registrationForm").style.display = "none";
        document.getElementById("receiptWrapper").style.display = "block";
        
        document.getElementById("res_id").innerText = uId;
        document.getElementById("res_name").innerText = fields.name;
        document.getElementById("res_mob").innerText = fields.mob;
        document.getElementById("res_loc").innerText = fields.dist;
        document.getElementById("res_join").innerText = fields.join;
        document.getElementById("res_time").innerText = timestamp;

        new QRCode(document.getElementById("qrOutput"), { text: uId, width: 90, height: 90 });
        Swal.fire({ icon: 'success', title: 'Success', text: 'Receipt Generated!' });

    } catch (error) {
        Swal.fire({ icon: 'error', title: 'Error', text: error.message });
        btn.disabled = false; btn.innerText = "CREATE ACCOUNT";
    }
}

function downloadJPG() {
    html2canvas(document.getElementById("receiptFinal"), { useCORS: true }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'YASK_Receipt.jpg';
        link.href = canvas.toDataURL('image/jpeg');
        link.click();
    });
}
